<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</head>
<body>
    <div class="container-fluid row">

        <div class="col-md-3 d-none d-md-block p-3 bg-light">
            <ul class="list-group">
                <li class="list-group-item">Mis Favoritos</li>
                <li class="list-group-item">Los más Queridos</li>
                <li class="list-group-item">Los menos Queridos</li>
            </ul>
        </div>

        <div class="col-12 col-md-9 m-auto row">
            <div class="col-md-6 col-lg-4 col-12 my-1">
                <div class="card h-100">
                    <img class="card-img-top p-3 rounded-5" src="img/Gato.jpg" alt="Card image">
                    <div class="card-body">
                        <h4 class="card-title">Gatillo</h4>
                        <p class="card-text">Un gato muy común.</p>
                        <a href="#" class="btn btn-primary">Añadir Favoritos</a>
                    </div>
                </div>            
            </div>

            <div class="col-md-6 col-lg-4 col-12 my-1">
                <div class="card h-100">
                    <img class="card-img-top p-3 rounded-5" src="img/Gato2.jpg" alt="Card image">
                    <div class="card-body">
                        <h4 class="card-title">Gato Vampiro</h4>
                        <p class="card-text">Chupa Sangre.</p>
                        <a href="#" class="btn btn-primary">Añadir Favoritos </a>
                    </div>
                </div>            
            </div>

            <div class="col-md-6 col-lg-4 col-12 my-1">
                <div class="card h-100">
                    <img class="card-img-top p-3 rounded-5" src="img/Gato3.jpg" alt="Card image">
                    <div class="card-body">
                        <h4 class="card-title">Gato Fuerte</h4>
                        <p class="card-text">Un gato muy fuerte.</p>
                        <a href="#" class="btn btn-primary">Añadir Favoritos</a>
                    </div>
                </div>            
            </div>

            <div class="container-fluid col-12 d-none d-md-block">
                <div class="col-9">
                    <img class="img-thumbnail" src="img/Gato4.jpg" alt="Card image">
                </div>

                <div class="col-3">
                    <img class="img-thumbnail" src="img/Gato5.jpg" alt="Card image">
                    <img class="img-thumbnail" src="img/Gato6.jpg" alt="Card image">
                </div>
                

            </div>
        </div>
    </div>
</body>
</html>
